<VirtualHost *:443>

    ServerName ldap.alpesnet.local

    DocumentRoot /var/www/html
    #DocumentRoot /var/www/html/public_html


    # LAM is installed here by the official LAM image
    Alias /lam /usr/share/ldap-account-manager

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    
    # Redirect https://ldap.alpesnet.local:8444/
    # to the LAM application
    RewriteEngine On
    RewriteRule ^/$ /lam/ [R=301,L]
    
    ErrorLog ${APACHE_LOG_DIR}/lam-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/lam-ssl-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/ssl/lam/ldap.crt
    SSLCertificateKeyFile /etc/ssl/lam/ldap.key
    
</VirtualHost>
