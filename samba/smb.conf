[global]
   workgroup = WORKGROUP
   server string = Samba File Server
   security = user

   map to guest = Bad User

   log file = /var/log/samba/log.%m
   max log size = 50

   server min protocol = SMB2

[Public]
   path = /srv/samba/data
   browseable = yes
   writable = yes
   guest ok = yes
   read only = no
   
   valid users = sambauser
